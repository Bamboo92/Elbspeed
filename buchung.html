<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">

        <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/png" href="/images/favicon-16x16.png" sizes="16x16">
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <link rel="stylesheet" href="style.css">
        <title>Buchung | Elbspeed Autovermietung</title>
    </head>
    <body class="guide">
        <a href="/"><img src="images/logo.svg" class="logo unselectable" alt="elbspeed-logo" title="Elbspeed"/></a>

        <h1>Buchen</h1>
        <div id="rent-div">


            <main id="rent-main">
                <form class="card unselectable" id="rent-form" action="#" method="POST">
                    <input type="hidden" name="access_key" value="3a601ac1-b39b-4e5a-ae17-ff1e1410fad0">
                    <label id="contact-label-street" for="street"></label>
                    <label id="contact-label-tel" for="tel"></label>
                    <label id="contact-label-email" for="email"></label>
                    <label id="contact-label-car" for="car"></label>
                    <label id="contact-label-plan" for="plan"></label>
                    <div class="rent-dates">
                        <input class="contact-input" type="text" id="car" name="car" placeholder="car" value="Selected Car" readonly><br>
                        <p></p>
                        <input class="contact-input" type="text" id="plan" name="plan" placeholder="plan" readonly><br>
                    </div><br class="no-br">
                    <label id="contact-label-name" for="name">Daten</label><br class="no-br">
                    <input class="contact-input" type="text" id="name" name="name" placeholder="Name, Vorname" required><br class="no-br">
                    <input class="contact-input" type="text" id="street" name="street" placeholder="Straße, PLZ Ort " required><br class="no-br">
                    <div class="rent-dates" id="rent-dates-birthdate">
                        <label id="contact-label-birthdate" for="birthdate">Geburtsdatum:</label>
                        <input class="contact-input date-input" type="date" id="birthdate" name="birthdate" placeholder="Geburtsdatum" required>
                    </div><br class="no-br">
                    <input class="contact-input" type="tel" id="tel" name="tel" placeholder="Telefonnummer" required><br class="no-br">
                    <input class="contact-input" type="email" id="email" name="email" placeholder="E-Mail-Adresse" required><br class="no-br">
                    <div class="rent-dates">
                        <label id="contact-label-abholdatum" for="abholdatum">Abholdatum</label><br class="no-br">
                        <p></p>
                        <input class="contact-input date-input" type="date" id="abholdatum" name="abholdatum" required><br class="no-br">
                        <p></p>
                        <label id="contact-label-abgabedatum" for="abgabedatum">Abgabedatum</label><br class="no-br">
                        <p></p>
                        <input class="contact-input date-input" type="date" id="abgabedatum" name="abgabedatum" required>
                    </div><br class="no-br">
                    <label class="contact-label-empty" for="message">Anmerkungen</label><br class="no-br">                
                    <textarea id="message" class="nachricht" name="message" rows="4" placeholder="z.B. Abholung oder Rückgabe an anderem Standort, mehrere Fahrer ... "></textarea><br class="no-br">
                    <footer class="rent-agree">
                        <div class="required">
                            <input class="" type="checkbox" id="agree1" name="agree" required>
                            <label for="agree1">Ich akzeptiere die <a href="datenschutzerklärung">Datenschutzerklärung</a>.</label>
                        </div>
                        <div class="required">
                            <input class="" type="checkbox" id="agree2" name="agree" required>
                            <label for="agree2">Ich akzeptiere die <a href="guides">Allgemeinen Mietbedingungen</a>.</label>
                        </div>
                    </footer>
                    <br class="no-br">
                    <button class="gradient-btn btn" id="rent-btn" type="submit" data-action="email" onclick="highlightInvalidFields()"><span class="detail-title">Buchen</span><span class="detail-value">ᐳ</span></button><br>
                    <button class="gradient-btn btn" id="rent-btn-whatsapp" type="submit" data-action="whatsapp" onclick="sendViaWhatsApp()">Über WhatsApp buchen</button>
                    <br>
                    <script>
                        const requiredFields = document.querySelectorAll("[required]");
                        const agbCheckbox = document.getElementsByClassName("required");

                        function highlightInvalidFields() {
                            // Prüft alle Felder mit Attribut [required]
                            requiredFields.forEach(field => {
                                if (!field.checkValidity()) {
                                    field.classList.add("invalid");
                                    field.addEventListener("input", () => field.classList.remove("invalid"));
                                } else {
                                    field.classList.remove("invalid");
                                }
                            });
                        
                            // Prüft alle Divs mit der Klasse "required"
                            const requiredDivs = document.querySelectorAll("div.required");
                            requiredDivs.forEach(div => {
                                const checkbox = div.querySelector("input[type='checkbox']");
                                if (checkbox && !checkbox.checked) {
                                    div.classList.add("invalid");
                                    checkbox.addEventListener("change", () => {
                                        if (checkbox.checked) {
                                            div.classList.remove("invalid");
                                        } else {
                                            div.classList.add("invalid");
                                        }
                                    });
                                } else {
                                    div.classList.remove("invalid");
                                }
                            });
                        }  
                    </script>
                </form>
                <ul id="contact-ul">
                    <li class="rent-li">
                        <article class="card contact-article" id="details-article">
                        </article>
                    </li>
                    <li class="rent-li">
                        <article class="card contact-article" id="price-article">
                
                        </article>
                    </li>
                    <li>
                        <aside class="slideshow-container unselectable">
                            <style>
                                .mySlides {
                                    display: none;
                                    margin: 0;
                                    width: 100%;
                                }
                                img {vertical-align: middle;}
                                .slideshow-container {
                                    max-width: 1000px;
                                    position: relative;
                                }
                                .prevnext-div {
                                    height: 100%;
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    position: absolute;
                                    top: 90%;
                                    left: 50%;
                                    transform: translate(-50%, -50%);
                                    width: 95%;
                                    display: flex;
                                    align-items: center;
                                    justify-content: space-between;
                                }
                                .prev, .next {
                                    cursor: pointer;
                                    text-align: center;
                                    color: var(--400);
                                    background-color: var(--100);
                                    font-weight: bold;
                                    width: auto;
                                    font-size: clamp(3px, 2vw, 30px);
                                    transition: 0.6s ease;
                                    border-radius: 0 5px 5px 0;
                                    -webkit-user-select: none;
                                    user-select: none;
                                    text-align: center;
                                    padding-block: .1vw;
                                    padding-inline: .1vw;
                                }
                                .prev {
                                    border-radius: 5px 0 0 5px;
                                }
                                .prev:hover, .next:hover {
                                    color: var(--600);
                                }
                                .numbertext {
                                    color: var(--50);
                                    font-size: clamp(3px, 2vw, 20px);
                                    padding-top: clamp(5px, 2vw, 20px);
                                    padding-left: clamp(6px, 2vw, 20px);
                                    position: absolute;
                                }
                                .dots {
                                    text-align: center;
                                    padding-top: clamp(3px, 1vw, 10px);
                                }
                                .dot {
                                    cursor: pointer;
                                    align-self: center;
                                    height: clamp(3px, 1vw, 10px);
                                    width: clamp(3px, 1vw, 10px);
                                    margin-inline: .1vw;
                                    background-color: var(--200);
                                    border-radius: 50%;
                                    display: inline-block;
                                }
                                .active, .dot:hover {
                                    background-color: var(--400);
                                }
                                .fade {
                                    animation-name: fade;
                                    animation-duration: 1.5s;
                                }
                                .rent_advertising {
                                    height: inherit;
                                    width: inherit;
                                }
                                @media (max-width: 899px) {
                                    .dots {
                                        padding-top: 0;
                                    }
                                }
                                @keyframes slideInFromRight {
                                    from {
                                    transform: translateX(100%);
                                    opacity: 1;
                                    }
                                    to {
                                    transform: translateX(0);
                                    opacity: 1;
                                    }
                                }

                                .mySlides {
                                    animation: slideOutFromLeft 1s forwards;
                                }
                            </style>
            
                            <div class="slideshow-container figure-div">

                            </div>
            
                            <nav class="dots">
                                
                            </nav>
                        </aside>
                    </li>
                </ul>
            </main>
            
            <div id="whatsapp-instructions">
                <img src="images/whatsApp_logo.webp" id="whatsapp-allert-img" class="socialmedia-img" alt="WhatsApp Logo" title="WhatsApp Logo" loading="lazy"/>
                <p>WhatsApp ist geöffnet. Bitte überprüfe die Nachricht und <b>drücke auf 'Senden'</b>, um deine Buchung abzuschließen.</p>
                <button onclick="window.location.href='/'" id="whatsapp-allert-button" class="btn gradient-btn">Fertig</button>
            </div>
            

            <footer>
                <nav class="legal-nav">
                    <span>ElbSpeed GmbH © 2025</span>
                    <a class="legal-link" href="impressum">Impressum</a>
                    <a class="legal-link" href="datenschutzerklaerung">Datenschutzerklärung</a>
                    <a class="legal-link" href="strafkatalog">Strafkatalog</a>
                    <a class="legal-link" href="guides">Allgemeine Mietbedingungen</a>
                </nav>
            </footer>
        </div>
        <script type="module">
            import { cars } from '/data/cars.js'

            document.addEventListener('DOMContentLoaded', function() {
                // Überprüfung, ob der Benutzer von der Preisplan-Seite kommt
                const accessFromPreisplan = localStorage.getItem('accessFromPreisplan');
                if (!accessFromPreisplan) {
                    // Wenn der Benutzer nicht von der Preisplan-Seite kommt, wird er zur Index-Seite weitergeleitet
                    window.location.href = '/';
                } else {
                    // Optional: Flag entfernen, nachdem die Buchungsseite erreicht wurde
                    localStorage.removeItem('accessFromPreisplan');
                }

                // Fahrzeug- und Plan-Daten aus dem localStorage laden
                const selectedCarId = localStorage.getItem('selectedCarId');
                const selectedPriceId = localStorage.getItem('selectedPriceId');

                const car = cars.find(c => c.id === selectedCarId);
                const pricePlan = car?.prices.find(p => p.id === selectedPriceId);

                // Formularfelder mit den gespeicherten Werten füllen
                if (selectedCarId && selectedPriceId) {
                    document.getElementById('car').value = selectedCarId;
                    document.getElementById('plan').value = pricePlan.name + " " + pricePlan.days;
                }

                const specs = document.getElementById('details-article');
                specs.innerHTML = `
                    <p class="detail"><span class="detail-title">Leistung:</span><span class="detail-value">${car.specs.power_hp}</span></p>
                    <p class="detail"><span class="detail-title">Drehmomment:</span><span class="detail-value">${car.specs.torque_nm}</span></p>
                    <p class="detail"><span class="detail-title">VMAX:</span><span class="detail-value">${car.specs.vmax_kmh}</span></p>
                    <p class="detail"><span class="detail-title">0-100 km/h:</span><span class="detail-value">${car.specs.acceleration_0_100}</span></p>
                `;

                const price = document.getElementById('price-article');
                price.innerHTML = `
                    <p id="detail-cost" class="detail"><span class="detail-title">${pricePlan.price}${pricePlan.currency}</span><span class="detail-value">/ ${pricePlan.duration_h} Std.</span></p>
                    <p class="detail"></p>
                    <p class="detail"><span class="detail-title">Kaution:</span><span class="detail-value">1 000€ oder KfZ*</span></p>
                    <p class="detail"><span class="detail-title">SB:</span><span class="detail-value">2 500€</span></p>
                    <details id="price-article-dropdown">
                        <summary>Extra km:</summary>
                        <p>
                            <ul>
                                <li>Hinzubuchung von Kilometern vor Mietbeginn: ${pricePlan.added_km}€ /km</li>
                                <li>Überzogene Kilometer bei Fahrzeugabgabe: ${pricePlan.penalty_km}€ /km</li>
                            </ul>
                        </p>
                    </details>
                    <br>
                    <p class="detail"><span class="detail-title"></span><span class="detail-value">Alles inkl. mwst.</span></p>
                    <p class="detail" style="font-size: clamp(10px, 2.2vmin, 25px); margin: 0">*Eigenes KfZ muss ein Mindestwert von 1000€ haben</p>

                `;

                // Slideshow dynamisch laden
                const images = car?.images || [];
                if (!images.length) return;
                {
                    const slideshowContainer = document.querySelector('.figure-div');
                    const dotsContainer = document.querySelector('.dots');
                    slideshowContainer.innerHTML = '';
                    dotsContainer.innerHTML = '';

                    images.forEach((imagePath, index) => {
                        const slideFigure = document.createElement('figure');
                        slideFigure.classList.add('mySlides', 'fade');
                        slideFigure.innerHTML = `
                            <figcaption class="numbertext">${index + 1} / ${images.length}</figcaption>
                            <img src="${imagePath}" class="rent_advertising" alt="${selectedCarId}" title="${selectedCarId}" loading="lazy" onclick="openFullscreen(${index})"/>
                        `;
                        slideshowContainer.appendChild(slideFigure);

                        // Dots erstellen
                        const dot = document.createElement('span');
                        dot.classList.add('dot');
                        dot.setAttribute('onclick', `currentSlide(${index + 1})`);
                        dotsContainer.appendChild(dot);
                    });

                    // Slideshow initialisieren
                    showSlides(1);
                }
            });

            let currentFullscreenIndex = 0;
            let fullscreenImages = [];

            function openFullscreen(index) {
                currentFullscreenIndex = index;
                fullscreenImages = Array.from(document.querySelectorAll('.rent_advertising')).map(img => img.src);

                const fullscreenContainer = document.createElement('div');
                fullscreenContainer.id = 'fullscreen-container';
                fullscreenContainer.className = 'unselectable';

                const fullscreenImage = document.createElement('img');
                fullscreenImage.id = 'fullscreen-image';
                fullscreenImage.src = fullscreenImages[currentFullscreenIndex];
                fullscreenContainer.appendChild(fullscreenImage);

                const prevButton = document.createElement('div');
                prevButton.id = 'fullscreen-prev';
                prevButton.className = 'fullscreen-nav';
                prevButton.innerHTML = '&#10094;'; // Left arrow
                prevButton.onclick = () => navigateFullscreen(-1);
                fullscreenContainer.appendChild(prevButton);

                const nextButton = document.createElement('div');
                nextButton.id = 'fullscreen-next';
                nextButton.className = 'fullscreen-nav';
                nextButton.innerHTML = '&#10095;'; // Right arrow
                nextButton.onclick = () => navigateFullscreen(1);
                fullscreenContainer.appendChild(nextButton);

                const closeButton = document.createElement('div');
                closeButton.id = 'fullscreen-close';
                closeButton.innerHTML = '&times;'; // Schließen-Symbol (×)
                closeButton.onclick = closeFullscreen;
                fullscreenContainer.appendChild(closeButton);


                // Close fullscreen on click outside the image
                fullscreenContainer.onclick = (e) => {
                    if (e.target.id === 'fullscreen-container') {
                        closeFullscreen();
                    }
                };

                document.body.appendChild(fullscreenContainer);

                // Add keyboard navigation
                document.addEventListener('keydown', handleKeyNavigation);

                // Add touch gestures
                addTouchNavigation(fullscreenContainer);
            }
            window.openFullscreen = openFullscreen;

            function navigateFullscreen(direction) {
                currentFullscreenIndex = (currentFullscreenIndex + direction + fullscreenImages.length) % fullscreenImages.length;
                document.getElementById('fullscreen-image').src = fullscreenImages[currentFullscreenIndex];
            }

            function closeFullscreen() {
                const fullscreenContainer = document.getElementById('fullscreen-container');
                if (fullscreenContainer) {
                    document.body.removeChild(fullscreenContainer);
                    document.removeEventListener('keydown', handleKeyNavigation);
                }
            }

            function handleKeyNavigation(event) {
                if (event.key === 'ArrowLeft') {
                    navigateFullscreen(-1);
                } else if (event.key === 'ArrowRight') {
                    navigateFullscreen(1);
                } else if (event.key === 'Escape') {
                    closeFullscreen();
                }
            }

            function addTouchNavigation(container) {
                let startX = 0;
                let endX = 0;

                container.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                });

                container.addEventListener('touchend', (e) => {
                    endX = e.changedTouches[0].clientX;
                    if (startX > endX + 50) {
                        navigateFullscreen(1); // Swipe left
                    } else if (startX < endX - 50) {
                        navigateFullscreen(-1); // Swipe right
                    }
                });
            }

            // Slideshow-Funktionen
            let slideIndex = 1;

            function plusSlides(n) {
                showSlides(slideIndex += n);
            }
            window.plusSlides = plusSlides;


            function currentSlide(n) {
                showSlides(slideIndex = n);
            }
            window.currentSlide = currentSlide;

            function showSlides(n) {
                let i;
                let slides = document.getElementsByClassName("mySlides");
                let dots = document.getElementsByClassName("dot");
                if (n > slides.length) {slideIndex = 1}
                if (n < 1) {slideIndex = slides.length}
                for (i = 0; i < slides.length; i++) {
                    slides[i].style.display = "none";
                }
                for (i = 0; i < dots.length; i++) {
                    dots[i].className = dots[i].className.replace(" active", "");
                }
                slides[slideIndex-1].style.display = "block";
                dots[slideIndex-1].className += " active";
            }

            // Handling von Scroll- und Touch-Ereignissen für die Slideshow
            document.addEventListener('DOMContentLoaded', function() {
                const slideShowContainer = document.querySelector('.slideshow-container');
                if (!slideShowContainer) {
                    console.error('Slideshow container not found');
                    return;
                }

                slideShowContainer.addEventListener('mouseenter', () => {
                    slideShowContainer.addEventListener('wheel', handleScroll, { passive: false });
                });

                slideShowContainer.addEventListener('mouseleave', () => {
                    slideShowContainer.removeEventListener('wheel', handleScroll, { passive: false });
                });

                function handleScroll(event) {
                    let delta = event.wheelDelta || -event.detail;
                    if (delta > 0) {
                        plusSlides(-1);
                    } else {
                        plusSlides(1);
                    }
                    event.preventDefault();
                }

                let touchStartX = 0;
                let touchEndX = 0;

                slideShowContainer.addEventListener('touchstart', function(event) {
                    touchStartX = event.touches[0].clientX;
                }, false);

                slideShowContainer.addEventListener('touchend', function(event) {
                    touchEndX = event.changedTouches[0].clientX;
                    handleGesture();
                }, false);

                function handleGesture() {
                    if (touchEndX < touchStartX) {
                        plusSlides(1);
                    }
                    if (touchEndX > touchStartX) {
                        plusSlides(-1);
                    }
                }
            });
        </script>
        <script src="https://smtpjs.com/v3/smtp.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="script.js"></script>
    </body>
