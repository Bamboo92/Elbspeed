<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">

        <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/png" href="/images/favicon-16x16.png" sizes="16x16">
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <link rel="stylesheet" href="style.css">
        <title>Preisplan | Elbspeed Autovermietung</title>
    </head>
    <body id="price-plan">

        <h1>Preisplan</h1>
        <main id="price-plan-main">
            <section class="plan" id="basic-plans">

            </section>
            <aside class="elite-plan">
                <h1 class="elite-plan-h1">Elite-Plan</h1>
                <section class="plan" id="elite-plans">

                </section>
            </aside>
        </main>
        <script type="module">
            import { cars } from '/data/cars.js'

            document.addEventListener('DOMContentLoaded', function() {
                const accessFromInventory = localStorage.getItem('accessFromInventory');
                
                if (!accessFromInventory) {
                    // If the user didn't come from index.html, redirect them
                    window.location.href = '/';
                } else {
                    // Clear the flag and set a new one for navigation to buchung.html
                    localStorage.removeItem('accessFromInventory');
                    localStorage.setItem('accessFromPreisplan', 'true');
                }

                const selectedCarId = localStorage.getItem('selectedCarId');
                const car = cars.find(c => c.id === selectedCarId);

                const getPlanType = (p) => (p.plan || '').toLowerCase().replace(/\s+/g, '');
                const isEliteType = (t) => t === 'elite' || t === 'special-elite' || t === 'specialelite';
                const isSpecialType = (t) => t === 'special-elite';
                const isBasicType = (t) => t === 'basic';

                const renderCard = (p) => {
                    const t = getPlanType(p);
                    const classes = ['card plan-card'];
                    const buttonClasses = ['btn unselectable price-plan-btn'];
                    if (isSpecialType(t)) classes.push(' special'), buttonClasses.push(' gradient-btn')
                    else buttonClasses.push(' outline-btn');
                    if (isEliteType(t)) classes.push(' elite');
            
                    return `
                        <article class="${classes.join('')}">
                            <h2 class="price-plan-h2">${p.name}</h2>
                            <h3 class="price-plan-h3"><span class="price-plan-h3-currency">${p.currency}</span><span class="price-plan-h3-amount">${p.price}</span><span class="price-plan-h3-job">/<span>${p.duration_h}</span> Std.</span></h3>
                            <button class="${buttonClasses.join('')}" data-price-id="${p.id}">Fortfahren</button>
                            <p class="price-plan-free-km"><span class="price-plan-p-free">${p.included_km}</span><span class="price-plan-p-km">/Frei-km</span></p>
                            <p class="price-plan-p">Tage:<br><span class="price-plan-wochentage">${p.days}</span></p>
                            <footer class="price-plan-footer">
                                <details class="price-plan-details price-plan-p">
                                    <summary class="price-plan-details-summary unselectable">Mehr Frei KM</summary>
                                    <p class="price-plan-details-p">Hinzubuchung von Kilometern vor Mietbeginn:</p>
                                    <p class="price-plan-details-p"><span class="price-plan-details-currency">${p.currency}</span><span class="price-plan-details-amount">${p.added_km}</span><span class="price-plan-details-job">/km.</span></p>
                                    <p class="price-plan-details-p">Überzogene Kilometer bei Fahrzeugabgabe:</p>
                                    <p class="price-plan-details-p"><span class="price-plan-details-currency">${p.currency}</span><span class="price-plan-details-amount">${p.penalty_km}</span><span class="price-plan-details-job">/km.</span></p>
                                </details>
                            </footer>
                        </article>
                    `
                };

                const basicCards = [];
                const eliteCards = [];

                (car?.prices || []).forEach(p => {
                    const t = getPlanType(p);
                    const card = renderCard(p);
                    if (isBasicType(t))
                        basicCards.push(card);
                    else if (isEliteType(t) || isSpecialType(t))
                        eliteCards.push(card);
                });

                const basicPlans = document.getElementById('basic-plans');
                basicPlans.innerHTML = basicCards.join('');
                const elitePlans = document.getElementById('elite-plans');
                elitePlans.innerHTML = eliteCards.join('');

                document.querySelectorAll('.price-plan-btn').forEach(btn => {
                    btn.addEventListener('click', () => selectPlan(btn.dataset.priceId));
                });
            });

            function selectPlan(selectedPriceId) {
                localStorage.setItem('selectedPriceId', selectedPriceId);
                window.location.href = 'buchung';
            }
        </script>
    </body>
</html>
